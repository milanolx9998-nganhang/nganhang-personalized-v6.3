name: nganhang-home-app
services:
  app:
    build: ..
    image: nganhang-home-app:${APP_VERSION:-6.6.7.1}
    restart: unless-stopped
    init: true
    env_file: .env.home
    command: ["node", "src/server.js"]
    networks: [default, supabase]
    volumes:
      - home_import_temp:/data/import-temp
      - home_app_backups:/data/backups
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 20s
      retries: 3
  # Redis chỉ làm cache + bộ đếm rate limit (PERF V6.6.7). Không publish cổng 6379; app gọi redis://redis:6379
  # trong mạng nội bộ compose. Không lưu dữ liệu nghiệp vụ nên tắt ghi đĩa; Redis dừng thì app vẫn chạy (cache=degraded).
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    networks: [default]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.home:/etc/caddy/Caddyfile:ro
      - home_caddy_data:/data
      - home_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
networks:
  supabase:
    external: true
    name: nganhang-home-supabase_default
volumes:
  home_import_temp:
  home_app_backups:
  home_caddy_data:
  home_caddy_config:
